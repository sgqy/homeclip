name: Verify and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Verify Rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --locked
      - name: Build web client
        working-directory: web
        run: npm ci && npm run build
      - name: Browser tests
        working-directory: web
        run: npx playwright install --with-deps chromium && npm test
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
      - name: Cache Rust release build for Docker
        id: docker-rust-cache
        uses: actions/cache@v5
        with:
          path: .local/docker-rust-cache
          key: ${{ runner.os }}-${{ runner.arch }}-docker-rust-${{ hashFiles('Dockerfile', 'Cargo.toml', 'Cargo.lock') }}
      - name: Restore Docker Cargo cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: .local/docker-rust-cache
          scratch-dir: .local/cache-dance
          dockerfile: Dockerfile
          skip-extraction: ${{ steps.docker-rust-cache.outputs.cache-hit }}
      - name: Build scratch image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: homeclip:latest
          cache-from: type=gha,scope=homeclip
          cache-to: type=gha,mode=max,scope=homeclip
      - name: Verify image and persistent storage
        run: node scripts/verify-image.mjs homeclip:latest
      - name: Export image
        run: docker save -o homeclip-linux-amd64.tar homeclip:latest
      - uses: actions/upload-artifact@v7
        with:
          name: homeclip-linux-amd64
          path: |
            homeclip-linux-amd64.tar
            compose.yaml
            .local/image-check.json
          include-hidden-files: true
          retention-days: 14
